name: Open receipt
description: Define the evidence event and accountable acceptance needed for promotion.
title: "RCP: "
labels:
  - open-receipt
body:
  - type: dropdown
    id: proof_class
    attributes:
      label: Proof class
      options:
        - configured_vendor_environments
        - representative_migration_and_restore
        - production_security_and_observability
        - scientific_quality_regulatory_acceptance
    validations:
      required: true
  - type: textarea
    id: success_event
    attributes:
      label: Success event
      description: Describe the observed evidence that advances the receipt.
    validations:
      required: true
  - type: textarea
    id: accountable_roles
    attributes:
      label: Accountable roles
    validations:
      required: true

