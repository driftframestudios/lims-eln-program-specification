name: Program pull request

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: program-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  program-pr-validation:
    name: program-pr-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: ""

      - name: Install the contract model boundary
        run: python -m pip install --disable-pip-version-check .

      - name: Validate repository-owned contracts
        run: |
          python scripts/validate_program.py
          python scripts/check_language.py
          python scripts/scan_secret_shapes.py
          PYTHONPATH=src python scripts/generate_contract_schemas.py --check
          python -m unittest discover -s tests -v
