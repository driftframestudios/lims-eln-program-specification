name: Validate program specification

on:
  workflow_dispatch:
    inputs:
      confirm_run:
        description: Confirm a human has allocated this remote proof
        required: true
        default: false
        type: boolean
      release_tag:
        description: Optional signed Program release tag verified by this carrier
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: program-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  author-feedback:
    name: author-feedback (advisory)
    if: ${{ vars.ENABLE_GITHUB_ACTIONS == 'true' && inputs.confirm_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified Vale
        env:
          VALE_ARCHIVE: vale_3.15.2_Linux_64-bit.tar.gz
          VALE_SHA256: fc72e64454d6bd7af91905d4faebbf411bae3eec17bb572f4101311212bc0d9e
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$VALE_ARCHIVE" \
            "https://github.com/vale-cli/vale/releases/download/v3.15.2/$VALE_ARCHIVE"
          echo "$VALE_SHA256  $RUNNER_TEMP/$VALE_ARCHIVE" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/vale"
          tar --extract --gzip --file "$RUNNER_TEMP/$VALE_ARCHIVE" \
            --directory "$RUNNER_TEMP/vale"
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"
      - name: Review authored prose and comments
        continue-on-error: true
        run: >-
          vale --config=.vale.ini --no-global --no-exit
          --minAlertLevel=warning .

  program:
    name: program-contracts (${{ matrix.python-version }})
    if: ${{ vars.ENABLE_GITHUB_ACTIONS == 'true' && inputs.confirm_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - name: Check out the pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: ""

      - name: Install the contract model boundary
        run: python -m pip install --disable-pip-version-check .

      - name: Validate stable identifiers and trace links
        run: python scripts/validate_program.py

      - name: Validate the Program release observation state
        run: python scripts/verify_program_release_observation.py

      - name: Check negation-aware language
        run: python scripts/check_language.py

      - name: Exercise program contracts
        run: python -m unittest discover -s tests -v

      - name: Scan secret shapes with redacted findings
        run: python scripts/scan_secret_shapes.py

  candidate-coordinates:
    name: candidate-coordinates
    if: ${{ vars.ENABLE_GITHUB_ACTIONS == 'true' && inputs.confirm_run && inputs.release_tag == '' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/spec-v') && !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/heads/hotfix/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate external coordinate readiness
        run: python scripts/validate_pinned_sources.py --preflight-external

  cross-repository-contracts:
    name: cross-repository-contracts
    if: ${{ vars.ENABLE_GITHUB_ACTIONS == 'true' && inputs.confirm_run && (inputs.release_tag != '' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/spec-v') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the program candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require pinned external coordinates before checkout
        run: python scripts/validate_pinned_sources.py --preflight-external

      - name: Confirm private sibling read access
        env:
          GH_TOKEN: ${{ secrets.CONSTELLATION_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=Private sibling read access needs a credential::Configure the CONSTELLATION_READ_TOKEN repository secret with Contents read access to the four pinned sibling repositories, then dispatch this proof again."
            exit 1
          fi
          if ! gh api --silent user >/dev/null 2>&1; then
            echo "::error title=Private sibling credential needs authentication::Store an active GitHub token in CONSTELLATION_READ_TOKEN, then dispatch this proof again."
            exit 1
          fi
          echo "Private sibling credential authentication confirmed."
          for coordinate in simulation implementation comparison governance; do
            case "$coordinate" in
              simulation)
                repository="driftframestudios/lims-eln-simulated-final-state"
                ;;
              implementation)
                repository="driftframestudios/lims-eln-enterprise-implementation"
                ;;
              comparison)
                repository="driftframestudios/lims-eln-comparative-evidence"
                ;;
              governance)
                repository="driftframestudios/site-reading-governance"
                ;;
            esac
            commit="$(jq -r --arg coordinate "$coordinate" '.[$coordinate].commit' constellation.lock.json)"
            metadata_response_file="$RUNNER_TEMP/program-sibling-$coordinate-metadata.response"
            if ! gh api --include "repos/$repository" >"$metadata_response_file" 2>/dev/null; then
              metadata_status="$(awk '/^HTTP/{code=$2} END{print code}' "$metadata_response_file")"
              metadata_status="${metadata_status:-unavailable}"
              metadata_diagnostic="$(python scripts/summarize_github_api_response.py "$metadata_response_file")"
              rm -f "$metadata_response_file"
              echo "Normalized GitHub API metadata response: $metadata_diagnostic"
              echo "::error title=Private sibling repository metadata is unavailable::Credential authentication is established; the metadata request returned HTTP $metadata_status. Use the normalized rate, retry, and SSO states above, then confirm the token resource owner, repository selection, approval state, and repository token policy for $repository before dispatching this proof again."
              exit 1
            fi
            rm -f "$metadata_response_file"
            echo "Confirmed private sibling repository metadata access: $coordinate"
            response_file="$RUNNER_TEMP/program-sibling-$coordinate.response"
            if gh api --include "repos/$repository/contents?ref=$commit" >"$response_file" 2>/dev/null; then
              rm -f "$response_file"
              echo "Confirmed private sibling read access: $coordinate@$commit"
              continue
            fi
            status="$(awk '/^HTTP/{code=$2} END{print code}' "$response_file")"
            status="${status:-unavailable}"
            diagnostic="$(python scripts/summarize_github_api_response.py "$response_file")"
            rm -f "$response_file"
            echo "Normalized GitHub API Contents response: $diagnostic"
            case "$status" in
              403)
                echo "::error title=Private sibling Contents request is forbidden::Credential authentication and repository metadata access are established. Use the normalized rate, retry, SSO, and accepted-permission states above, then ensure Contents read permission and repository policy admit $repository before dispatching this proof again."
                ;;
              404)
                echo "::error title=Private sibling coordinate is unavailable to this credential::Credential authentication and repository metadata access are established. Use the normalized response above, then ensure Contents read permission is active and confirm pinned commit $commit remains available before dispatching this proof again."
                ;;
              unavailable)
                echo "::error title=Private sibling probe returned without an HTTP status::Credential authentication is established. Restore GitHub API connectivity, then dispatch this proof again."
                ;;
              *)
                echo "::error title=Private sibling read probe received HTTP $status::Credential authentication is established. Confirm $repository and pinned commit $commit are available, then dispatch this proof again."
                ;;
            esac
            exit 1
          done

      - name: Verify the selected Program release subject
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          selected_tag="$REQUESTED_RELEASE_TAG"
          if [ -z "$selected_tag" ] && [[ "$GITHUB_REF" == refs/tags/spec-v* ]]; then
            selected_tag="$GITHUB_REF_NAME"
          fi
          if [ -z "$selected_tag" ]; then
            echo "Current carrier proof selected; proceeding with current source coordinates."
            exit 0
          fi
          expected_tag="$(jq -r '.specification.release' constellation.lock.json)"
          if [ "$selected_tag" != "$expected_tag" ]; then
            echo "::error title=Release tag differs from the Program lock::Select the signed Program release named by constellation.lock.json, then dispatch this proof again."
            exit 1
          fi
          tag_type="$(git cat-file -t "refs/tags/$selected_tag" 2>/dev/null || true)"
          if [ "$tag_type" != "tag" ]; then
            echo "::error title=Release subject needs an annotated tag::Create or select the signed annotated Program release recorded by the Program lock."
            exit 1
          fi
          release_commit="$(git rev-parse --verify "refs/tags/$selected_tag^{commit}")"
          carrier_commit="$(git rev-parse --verify HEAD)"
          if [ "$carrier_commit" != "$GITHUB_SHA" ]; then
            echo "::error title=Carrier checkout differs from the workflow context::Dispatch the proof again from the intended carrier ref."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_commit" "$carrier_commit"; then
            echo "::error title=Release subject is outside the carrier lineage::Use a carrier descended from the signed Program release."
            exit 1
          fi
          git \
            -c gpg.format=ssh \
            -c gpg.minTrustLevel=fully \
            -c gpg.ssh.allowedSignersFile=release/trusted-release-signers \
            -c gpg.ssh.revocationFile=/dev/null \
            verify-tag "$selected_tag"
          echo "Verified signed release subject: tag=$selected_tag release_commit=$release_commit carrier_commit=$carrier_commit"

      - name: Resolve immutable external coordinates
        id: coordinates
        run: |
          echo "simulation=$(jq -r '.simulation.commit' constellation.lock.json)" >> "$GITHUB_OUTPUT"
          echo "implementation=$(jq -r '.implementation.commit' constellation.lock.json)" >> "$GITHUB_OUTPUT"
          echo "comparison=$(jq -r '.comparison.commit' constellation.lock.json)" >> "$GITHUB_OUTPUT"
          echo "governance=$(jq -r '.governance.commit' constellation.lock.json)" >> "$GITHUB_OUTPUT"

      - name: Check out the simulation coordinate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: driftframestudios/lims-eln-simulated-final-state
          ref: ${{ steps.coordinates.outputs.simulation }}
          token: ${{ secrets.CONSTELLATION_READ_TOKEN }}
          path: constellation/simulation
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the implementation coordinate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: driftframestudios/lims-eln-enterprise-implementation
          ref: ${{ steps.coordinates.outputs.implementation }}
          token: ${{ secrets.CONSTELLATION_READ_TOKEN }}
          path: constellation/implementation
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the comparison coordinate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: driftframestudios/lims-eln-comparative-evidence
          ref: ${{ steps.coordinates.outputs.comparison }}
          token: ${{ secrets.CONSTELLATION_READ_TOKEN }}
          path: constellation/comparison
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the governance coordinate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: driftframestudios/site-reading-governance
          ref: ${{ steps.coordinates.outputs.governance }}
          token: ${{ secrets.CONSTELLATION_READ_TOKEN }}
          path: constellation/governance
          persist-credentials: false
          fetch-depth: 0

      - name: >-
          Validate pinned sources, historical schema compatibility, and canonical
          closure equality
        run: |
          pending_mode=()
          if jq --exit-status \
            '.specification.coordinate_status == "pending_release_commit"' \
            constellation.lock.json >/dev/null; then
            pending_mode+=(--allow-pending)
          fi
          python scripts/validate_pinned_sources.py "${pending_mode[@]}" \
              --source simulation=constellation/simulation \
              --source implementation=constellation/implementation \
              --source comparison=constellation/comparison \
              --source governance=constellation/governance

      - name: Validate program orientation against pinned governance
        run: |
          python constellation/governance/tools/validate_governance.py \
            --governance-root constellation/governance \
            --source-root . \
            --schema-name machine-node.schema.json \
            --document-path machine-node.json
          python constellation/governance/tools/validate_governance.py \
            --governance-root constellation/governance \
            --source-root . \
            --schema-name first-receipt.schema.json \
            --document-path first-receipt.json
          python constellation/governance/tools/validate_governance.py \
            --governance-root constellation/governance \
            --source-root . \
            --schema-name coordination-horizon.schema.json \
            --document-path coordination-horizon.json

  program-validation:
    name: program-validation
    if: ${{ always() && vars.ENABLE_GITHUB_ACTIONS == 'true' && inputs.confirm_run }}
    needs:
      - program
      - candidate-coordinates
      - cross-repository-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require program and applicable coordinate checks
        env:
          PROGRAM_RESULT: ${{ needs.program.result }}
          CANDIDATE_RESULT: ${{ needs.candidate-coordinates.result }}
          CROSS_REPOSITORY_RESULT: ${{ needs.cross-repository-contracts.result }}
        run: |
          test "$PROGRAM_RESULT" = "success"
          test "$CANDIDATE_RESULT" = "success" || test "$CROSS_REPOSITORY_RESULT" = "success"
