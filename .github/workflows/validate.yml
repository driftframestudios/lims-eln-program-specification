name: Validate program specification

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: program-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  program:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - name: Check out the pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: ""

      - name: Validate stable identifiers and trace links
        run: python scripts/validate_program.py

      - name: Exercise program contracts
        run: python -m unittest discover -s tests -v

      - name: Scan secret shapes with redacted findings
        run: python scripts/scan_secret_shapes.py
