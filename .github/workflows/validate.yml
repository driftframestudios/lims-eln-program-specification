name: validate-program-specification

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: program-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specifications:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install JSON Schema validation
        run: python -m pip install --disable-pip-version-check --editable ".[validation]"
      - name: Exercise vendor-evaluation and data contracts
        run: python -m unittest discover -s tests -v

  prose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install checksum-verified Vale
        env:
          VALE_ARCHIVE: vale_3.15.2_Linux_64-bit.tar.gz
          VALE_SHA256: fc72e64454d6bd7af91905d4faebbf411bae3eec17bb572f4101311212bc0d9e
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$VALE_ARCHIVE" \
            "https://github.com/vale-cli/vale/releases/download/v3.15.2/$VALE_ARCHIVE"
          echo "$VALE_SHA256  $RUNNER_TEMP/$VALE_ARCHIVE" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/vale"
          tar --extract --gzip --file "$RUNNER_TEMP/$VALE_ARCHIVE" \
            --directory "$RUNNER_TEMP/vale"
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"
      - name: Review active prose and comments
        run: >-
          vale --config=.vale.ini --no-global --minAlertLevel=warning
          README.md CONTRIBUTING.md SECURITY.md charter docs
